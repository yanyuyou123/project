spring:
  application:
    name: tlias-wep-management
  # 激活 dev 环境，否则下面 ${Tlias.datasource.*} 的占位符无从解析，应用启动即失败
  profiles:
    active: dev
  datasource:
    url: ${Tlias.datasource.url}
    driver-class-name: ${Tlias.datasource.driver-class-name}
    username: ${Tlias.datasource.username}
    password: ${Tlias.datasource.password}
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true #自动驼峰命名映射
  mapper-locations: classpath:mapper/*.xml
# JWT 配置：secret 至少 32 字节，expire-minutes 为令牌有效期（分钟）
jwt:
  secret: tlias-wep-management-jwt-secret-key-0123456789-abcdefghijklmn
  expire-minutes: 60